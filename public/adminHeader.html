<style>
  body {
    font-family: 'Orbitron', 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    padding-top: 70px;
    overflow-x: hidden;
    height: 100vh;
    background: #0a0a0a;
  }

  #header {
    padding: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    position: fixed;
    top: 0;
    width: 100%;
    height: 70px;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(157, 78, 221, 0.3);
  }

  .navbar {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-bottom: 2px solid #9d4edd;
    height: 70px;
    position: relative;
  }

  .navbar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(157, 78, 221, 0.1), transparent);
    animation: scan 3s linear infinite;
  }

  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .navbar-brand {
    color: #9d4edd !important;
    font-weight: bold;
    font-size: 1.4rem;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #9d4edd, 0 0 20px #9d4edd, 0 0 30px #9d4edd;
    font-family: 'Orbitron', monospace;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .robot-icon {
    font-size: 1.4rem;
  }

  .navbar-brand:hover {
    text-shadow: 0 0 15px #9d4edd, 0 0 30px #9d4edd, 0 0 45px #9d4edd;
  }

  .navbar-nav .nav-link {
    color: #9d4edd !important;
    transition: all 0.3s ease;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
    font-size: 0.9rem;
  }

  .navbar-nav .nav-link:hover {
    color: #7b2cbf !important;
    text-shadow: 0 0 8px #7b2cbf;
  }

  .navbar-nav .nav-link::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #9d4edd, #7b2cbf);
    transition: width 0.3s ease;
  }

  .navbar-nav .nav-link:hover::after {
    width: 100%;
  }

  .dropdown-menu {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: 1px solid #9d4edd;
    box-shadow: 0 5px 20px rgba(157, 78, 221, 0.3);
    backdrop-filter: blur(10px);
  }

  .dropdown-item {
    color: #9d4edd;
    transition: all 0.3s ease;
    font-weight: 500;
  }

  .dropdown-item:hover {
    background: linear-gradient(90deg, #9d4edd, #7b2cbf);
    color: #fff;
    text-shadow: 0 0 5px #fff;
  }

  .profile-img {
    object-fit: cover;
    border: 2px solid #9d4edd;
    box-shadow: 0 0 10px rgba(157, 78, 221, 0.6);
    transition: all 0.3s ease;
  }

  .profile-img:hover {
    
    box-shadow: 0 0 15px rgba(157, 78, 221, 0.8);
  }

  .btn-hw {
    background: linear-gradient(135deg, #9d4edd, #7b2cbf);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(157, 78, 221, 0.4);
    position: relative;
    z-index: 2;
  }

  .btn-hw:hover {
    background: linear-gradient(135deg, #7b2cbf, #9d4edd);
    color: white;
    box-shadow: 0 0 15px rgba(157, 78, 221, 0.6);
    transform: translateY(-2px);
  }

  .btn-hw-outline {
    border: 2px solid #9d4edd;
    color: #9d4edd;
    background: transparent;
    border-radius: 8px;
    padding: 6px 16px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(157, 78, 221, 0.3);
    position: relative;
    z-index: 2;
  }

  .btn-hw-outline:hover {
    background: linear-gradient(135deg, #9d4edd, #7b2cbf);
    color: #fff;
    box-shadow: 0 0 15px rgba(157, 78, 221, 0.6);
    transform: translateY(-2px);
  }

  .form-control {
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid #9d4edd;
    color: #9d4edd;
    border-radius: 8px;
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 2;
  }

  .form-control:focus {
    background: rgba(255, 255, 255, 0.8);
    border-color: #7b2cbf;
    box-shadow: 0 0 10px rgba(157, 78, 221, 0.5);
    color: #9d4edd;
  }

  .form-control::placeholder {
    color: rgba(157, 78, 221, 0.6);
  }

  .badge {
    background: linear-gradient(135deg, #ff006e, #fb5607) !important;
    box-shadow: 0 0 8px rgba(255, 0, 110, 0.6);
    font-weight: bold;
  }

  .navbar-toggler {
    border: 1px solid #9d4edd;
    position: relative;
    z-index: 2;
  }

  .navbar-toggler-icon {
    filter: invert(1) sepia(1) saturate(5) hue-rotate(180deg);
  }

  @media (max-width: 768px) {
    form.d-flex {
      flex-direction: column;
      gap: 5px;
    }

    .navbar-nav.ms-auto {
      flex-direction: column;
      align-items: start !important;
    }

    .navbar-nav.ms-auto form {
      width: 100%;
    }

    .navbar::before {
      display: none;
    }

  }
</style>

<!-- jQuery and Bootstrap Bundle (with Popper) -->

<script>
  function logoutUser() {
    localStorage.removeItem('token');
    localStorage.removeItem('userId');
    window.location.href = '/login.html';
  }

  function updateCartCount() {
    const token = localStorage.getItem('token');
    const userId = localStorage.getItem('userId');
    if (!token || !userId) {
      $('#cart-count').text(0);
      return;
    }
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    $('#cart-count').text(cart.length);
  }

  $(document).ready(function () {
    const token = localStorage.getItem('token');
    const userId = localStorage.getItem('userId');

    if (token && userId) {
      $('#login-link, #register-link').addClass('d-none');
      $('#user-dropdown').removeClass('d-none');

      $.get(`/api/users/customers/${userId}`, function (res) {
        if (res.success && res.data) {
          const data = res.data;
          const fullName = `${data.fname || ''} ${data.lname || ''}`.trim();
          $('#username').text(fullName || 'USER');
          if (data.image_path) {
            $('.profile-img').attr('src', `/${data.image_path}`);
          }
        }
      });
    } else {
      $('#login-link, #register-link').removeClass('d-none');
      $('#user-dropdown').addClass('d-none');
    }

    updateCartCount();
  });
</script>
