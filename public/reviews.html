<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Reviews Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous" />
  <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css"
    integrity="sha512-fjO3Vy3QodX9c6G9AUmr6WuIaEPdGRxBjD7gjatG5gGylzYyrEq3U0q+smkG6CwIY0L8XALRFHh4KPHig0Q1ug=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary-purple: #8b5cf6;
      --dark-purple: #6d28d9;
      --light-purple: #a78bfa;
      --accent-blue: #3b82f6;
      --light-blue: #60a5fa;
      --dark-bg: #0f0f23;
      --card-bg: #1e1b4b;
      --text-white: #ffffff;
      --text-light-gray: #e2e8f0;
      --border-color: rgba(139, 92, 246, 0.3);
      --card-shadow: 0 10px 40px rgba(139, 92, 246, 0.1);
      --glass-bg: rgba(30, 27, 75, 0.9);
      --success-color: #10b981;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --info-color: #06b6d4;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--dark-bg) 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: var(--text-white);
      padding-top: 70px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      z-index: -1;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary-purple), var(--accent-blue)) !important;
      border-bottom: 1px solid var(--border-color);
      padding: 20px 25px;
      color: var(--text-white) !important;
      font-weight: 600;
    }

    /* Tables */
    .table th {
      background: linear-gradient(135deg, var(--primary-purple), var(--accent-blue));
      color: white;
      border: none;
      padding: 15px 12px;
      text-transform: uppercase;
    }

    .table td {
      background: rgba(30, 27, 75, 0.3);
      color: var(--text-black) !important;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .table tr:hover td {
      background: rgba(139, 92, 246, 0.1);
    }

    /* Star Rating */
    .star-rating {
      color: var(--warning-color);
    }

    /* Buttons */
    .btn {
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
      border: none;
      padding: 8px 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-purple), var(--dark-purple));
      color: white;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
    }

    .action-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px !important;
    }

    /* Search */
    .search-container {
      max-width: 300px;
    }

    .search-container .form-control {
      background: rgba(30, 27, 75, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      border-radius: 10px;
    }

    .search-container .form-control:focus {
      background: rgba(30, 27, 75, 0.8);
      border-color: var(--primary-white);
      box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.25);
    }

    /* Pagination */
    .pagination {
      background: rgba(30, 27, 75, 0.4);
      border-radius: 15px;
      padding: 10px;
      border: 1px solid var(--border-color);
    }

    .pagination li a {
      background: rgba(30, 27, 75, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-white) !important;
    }

    .pagination li.active a {
      background: linear-gradient(135deg, var(--primary-purple), var(--accent-blue));
    }

    /* View Toggle */
    .view-option {
      padding: 8px 16px;
      margin: 0 5px;
      cursor: pointer;
      border-radius: 10px;
      background: rgba(30, 27, 75, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      transition: all 0.3s ease;
    }

    .view-option.active {
      background: linear-gradient(135deg, var(--primary-purple), var(--accent-blue));
      color: white;
      transform: translateY(-1px);
    }

    /* Loading States */
    .loading-spinner {
      text-align: center;
      padding: 30px;
      display: none;
      color: var(--text-white);
    }

    .scroll-info {
      text-align: center;
      padding: 20px;
      margin-top: 20px;
      background: rgba(30, 27, 75, 0.6);
      border-radius: 15px;
      border: 1px solid var(--border-color);
      display: none;
    }

    /* Export Buttons */
    .export-buttons {
      margin-bottom: 20px;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-color), #059669);
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger-color), #dc2626);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding-top: 60px;
      }
      .search-container {
        width: 100%;
      }
      .export-buttons .btn {
        margin: 5px;
        width: calc(50% - 10px);
      }
    }
  </style>
</head>

<body>
  <!-- Header will be loaded here -->
  <div id="adminHeader"></div>

  <div class="container-fluid py-4">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Reviews Management</h3>
        <button class="btn btn-light btn-sm" id="refreshBtn">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-12">
            <div class="d-flex align-items-center">
              <div class="mr-3">
                <span class="view-option active" data-view="pagination">Pagination</span>
                <span class="view-option" data-view="infinite">Infinite Scroll</span>
              </div>
              <div class="input-group search-container">
                <input type="text" id="searchInput" class="form-control" placeholder="" />
                <div class="input-group-append">
                  <button class="btn btn-outline-primary" type="button" id="searchBtn">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="export-buttons">
          <button class="btn btn-success" id="exportExcel"><i class="fas fa-file-excel"></i> Export Excel</button>
          <button class="btn btn-danger" id="exportPdf"><i class="fas fa-file-pdf"></i> Export PDF</button>
        </div>

        <div class="table-responsive">
          <table id="reviewsTable" class="table table-hover">
            <thead>
              <tr>
                <th>ID</th>
                <th>Order ID</th>
                <th>Item</th>
                <th>Rating</th>
                <th>Review</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="reviewsBody">
              <!-- Reviews will load here -->
            </tbody>
          </table>
        </div>
        
        <div id="pagination-container" class="pagination-container">
          <ul class="pagination" id="pagination">
            <!-- Pagination will be loaded here -->
          </ul>
        </div>
        
        <div id="scroll-info" class="scroll-info">
          <i class="fas fa-arrow-down"></i> Scroll down to load more reviews <i class="fas fa-arrow-down"></i>
        </div>
        
        <div id="loading-spinner" class="loading-spinner">
          <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
          </div>
          <p class="mt-2">Loading more reviews...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Libraries -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"
    integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js"
    integrity="sha512-LGHBR+kJ5jZSIzhhdfytPoEHzgaYuTRifq9g5l6ja6/k9NAOsAi5dQh4zQF6JIRB8cAYxTRedERUF+97/KuivQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/5.5.2/bootbox.min.js"
    integrity="sha512-RdSPYh1WA6BF0RhpisYJVYkOyTzK4HwofJ3Q7ivt/jkpW6Vc8AurL1R+4AUcvn9IwEKAPm/fk7qFZW3OuiUDeg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    $(document).ready(function() {
      $("#adminHeader").load("adminHeader.html", function() {
        $.getScript("js/review.js");
      });
    });
  </script>
</body>
</html>
