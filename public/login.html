<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROMEROS KINGDOM</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <!-- Latest compiled and minified CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css"
    integrity="sha512-fjO3Vy3QodX9c6G9AUmr6WuIaEPdGRxBjD7gjatG5gGylzYyrEq3U0q+smkG6CwIY0L8XALRFHh4KPHig0Q1ug=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"
    integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js"
    integrity="sha512-LGHBR+kJ5jZSIzhhdfytPoEHzgaYuTRifq9g5l6ja6/k9NAOsAi5dQh4zQF6JIRB8cAYxTRedERUF+97/KuivQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script src="js/login.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, #0a0a2e 0%, #16213e 25%, #1a1a40 50%, #2d1b69 75%, #3f4c6b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background elements */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(72, 85, 195, 0.2) 0%, transparent 50%);
      animation: pulse 6s ease-in-out infinite alternate;
      z-index: 0;
    }

    /* Circuit pattern overlay */
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(90deg, rgba(102, 126, 234, 0.1) 1px, transparent 1px),
        linear-gradient(rgba(102, 126, 234, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: circuitMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes circuitMove {
      0% { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.6), 0 0 40px rgba(147, 112, 219, 0.4), inset 0 0 20px rgba(102, 126, 234, 0.1); }
      50% { box-shadow: 0 0 30px rgba(102, 126, 234, 0.8), 0 0 60px rgba(147, 112, 219, 0.6), inset 0 0 30px rgba(102, 126, 234, 0.2); }
    }

    @keyframes borderScan {
      0% { border-image-source: linear-gradient(0deg, #667eea, #764ba2, #667eea); }
      25% { border-image-source: linear-gradient(90deg, #667eea, #764ba2, #667eea); }
      50% { border-image-source: linear-gradient(180deg, #667eea, #764ba2, #667eea); }
      75% { border-image-source: linear-gradient(270deg, #667eea, #764ba2, #667eea); }
      100% { border-image-source: linear-gradient(360deg, #667eea, #764ba2, #667eea); }
    }

    @keyframes slideIn {
      0% { transform: translateY(-50px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 10px rgba(102, 126, 234, 0.8), 0 0 20px rgba(147, 112, 219, 0.6); }
      50% { text-shadow: 0 0 20px rgba(102, 126, 234, 1), 0 0 30px rgba(147, 112, 219, 0.8); }
    }

    .login-container {
      background: rgba(15, 15, 35, 0.9);
      backdrop-filter: blur(20px);
      border: 2px solid;
      border-image: linear-gradient(45deg, #667eea, #764ba2, #667eea) 1;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      position: relative;
      z-index: 10;
      animation: glow 3s ease-in-out infinite, slideIn 0.8s ease-out;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(147, 112, 219, 0.1) 100%);
      border-radius: 18px;
      z-index: -1;
    }

    .login-container::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #667eea, #764ba2, #667eea);
      border-radius: 20px;
      z-index: -2;
      animation: borderScan 4s linear infinite;
    }

    h2 {
      font-family: 'Orbitron', monospace;
      color: #ffffff;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: textGlow 2s ease-in-out infinite;
      position: relative;
    }

    h2::before {
      content: '[ ';
      color: #667eea;
    }

    h2::after {
      content: ' ]';
      color: #667eea;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    input[type="email"], input[type="password"] {
      background: rgba(20, 25, 50, 0.8);
      border: 2px solid rgba(102, 126, 234, 0.5);
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 1.1rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
      color: #ffffff;
      transition: all 0.3s ease;
      outline: none;
      position: relative;
    }

    input[type="email"]::placeholder, input[type="password"]::placeholder {
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
      letter-spacing: 1px;
    }

    input[type="email"]:focus, input[type="password"]:focus {
      border-color: #667eea;
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.4), inset 0 0 10px rgba(102, 126, 234, 0.1);
      background: rgba(25, 30, 60, 0.9);
      transform: translateY(-2px);
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button[type="submit"]::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s;
    }

    button[type="submit"]:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4), 0 0 20px rgba(147, 112, 219, 0.3);
      background: linear-gradient(135deg, #7c8ef5 0%, #8b5fbf 100%);
    }

    button[type="submit"]:hover::before {
      left: 100%;
    }

    button[type="submit"]:active {
      transform: translateY(-1px);
    }

    #loginMsg {
      color: #ff6b6b;
      text-align: center;
      margin-top: 15px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .login-container > p:last-child {
      text-align: center;
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .login-container > p:last-child a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
    }

    .login-container > p:last-child a::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }

    .login-container > p:last-child a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
    }

    .login-container > p:last-child a:hover::before {
      width: 100%;
    }

    /* Floating geometric shapes */
    .floating-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      opacity: 0.3;
      animation: float 8s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      top: 10%;
      left: 10%;
      width: 40px;
      height: 40px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      transform: rotate(45deg);
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      top: 20%;
      right: 15%;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #764ba2, #667eea);
      border-radius: 50%;
      animation-delay: 2s;
    }

    .shape:nth-child(3) {
      bottom: 20%;
      left: 20%;
      width: 25px;
      height: 25px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      animation-delay: 4s;
    }

    .shape:nth-child(4) {
      bottom: 30%;
      right: 10%;
      width: 35px;
      height: 35px;
      background: linear-gradient(180deg, #764ba2, #667eea);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 0.6; }
    }

    /* Responsive design */
    @media (max-width: 480px) {
      .login-container {
        margin: 20px;
        padding: 30px 25px;
      }

      h2 {
        font-size: 1.8rem;
        letter-spacing: 2px;
      }

      input[type="email"], input[type="password"] {
        padding: 12px 16px;
        font-size: 1rem;
      }

      button[type="submit"] {
        padding: 12px 25px;
        font-size: 1.1rem;
        letter-spacing: 1px;
      }
    }
  </style>

  <title>Login</title>
</head>

<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginMsg"></p>
    <p>Don't have an account? <a href="register.html">Register here</a></p>
  </div>
</body>

</html>
