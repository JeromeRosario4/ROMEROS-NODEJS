<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f0d2a 0%, #1e1b4b 50%, #312e81 100%);
      min-height: 100vh;
      font-family: 'Orbitron', 'Courier New', monospace;
      color: #e0e7ff;
    }

    .container {
      position: relative;
    }

    .container::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(147, 51, 234, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    h2 {
      color: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 900;
      text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      margin-bottom: 30px;
      position: relative;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #9333ea, transparent);
      animation: scanLine 3s linear infinite;
    }

    @keyframes scanLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .card {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #581c87 100%);
      border: 2px solid #6366f1;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(99, 102, 241, 0.3);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #6366f1, #9333ea, #6366f1);
      border-radius: 15px;
      z-index: -1;
      animation: borderGlow 2s linear infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .card-body {
      position: relative;
      z-index: 1;
    }

    .card-body h4 {
      color: #e0e7ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1, #9333ea, transparent);
      margin: 20px 0;
      animation: hrPulse 2s ease-in-out infinite;
    }

    @keyframes hrPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .d-flex span, .d-flex strong {
      color: #a5b4fc;
      font-weight: 600;
    }

    .btn {
      border-radius: 8px;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-success {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      border: 2px solid #10b981;
      color: #fff;
      box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-success:hover:not(:disabled) {
      background: linear-gradient(135deg, #047857 0%, #065f46 100%);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
    }

    .btn-success:disabled {
      background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
      border-color: #4b5563;
      color: #6b7280;
      box-shadow: none;
    }

    .btn-outline-secondary {
      background: transparent;
      border: 2px solid #6366f1;
      color: #a5b4fc;
      box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
    }

    .btn-outline-secondary:hover {
      background: linear-gradient(135deg, #6366f1 0%, #9333ea 100%);
      border-color: #9333ea;
      color: #fff;
      box-shadow: 0 8px 25px rgba(147, 51, 234, 0.4);
      transform: translateY(-2px);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .bi-cart3 {
      color: #9333ea;
      margin-right: 10px;
      animation: cartFloat 3s ease-in-out infinite;
    }

    @keyframes cartFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .bi-credit-card, .bi-arrow-left {
      margin-right: 8px;
    }

    .quantity-input {
      width: 80px;
      margin: 0 auto;
      background: linear-gradient(145deg, #1e1b4b, #312e81);
      border: 2px solid #6366f1;
      color: #e0e7ff;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-weight: bold;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .quantity-input:focus {
      outline: none;
      border-color: #9333ea;
      box-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
    }

    .total-section {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #581c87 100%);
      border: 2px solid #6366f1;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.2);
      position: relative;
      overflow: hidden;
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #a5b4fc;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f0d2a 100%);
      border: 2px dashed #6366f1;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
    }

    .empty-cart i {
      font-size: 4rem;
      margin-bottom: 20px;
      color: #9333ea;
      text-shadow: 0 0 20px rgba(147, 51, 234, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .cart-header {
      border-bottom: 3px solid transparent;
      background: linear-gradient(90deg, #6366f1, #9333ea) bottom/100% 3px no-repeat;
      padding-bottom: 15px;
      margin-bottom: 20px;
      position: relative;
      font-family: 'Orbitron', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #e0e7ff;
    }

    .cart-summary {
      position: sticky;
      top: 20px;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 2px solid #6366f1;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
      backdrop-filter: blur(10px);
    }

    /* Glitch effect for totals */
    #selectedTotal {
      position: relative;
      display: inline-block;
    }

    #selectedTotal::before {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #9333ea;
      animation: glitch 2s infinite;
      clip: rect(0, 900px, 0, 0);
    }

    @keyframes glitch {
      0% { clip: rect(42px, 9999px, 44px, 0); }
      25% { clip: rect(12px, 9999px, 59px, 0); }
      50% { clip: rect(69px, 9999px, 71px, 0); }
      75% { clip: rect(30px, 9999px, 34px, 0); }
      100% { clip: rect(91px, 9999px, 92px, 0); }
    }

    /* Loading animation */
    .loading {
      position: relative;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 50%;
      right: 10px;
      width: 20px;
      height: 20px;
      border: 2px solid #6366f1;
      border-top: 2px solid #9333ea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      transform: translateY(-50%);
    }

    @keyframes spin {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <div class="row">
      <div class="col-lg-8">
        <h2><i class="bi bi-cart3"></i> Your Shopping Cart</h2>
        <div id="cartContents"></div>
      </div>
      
      <div class="col-lg-4">
        <div class="card cart-summary">
          <div class="card-body">
            <h4><i class="bi bi-cpu"></i> Order Summary</h4>
            <hr>
            <div class="d-flex justify-content-between mb-3">
              <span>Items:</span>
              <span id="selectedCount">0</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <strong>Total:</strong>
              <strong id="selectedTotal" data-text="₱0.00">₱0.00</strong>
            </div>
            <button class="btn btn-success w-100" id="checkoutBtn" disabled>
              <i class="bi bi-credit-card"></i> Checkout
            </button>
            <a href="/home.html" class="btn btn-outline-secondary w-100 mt-2">
              <i class="bi bi-arrow-left"></i> Continue Shopping
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Enhanced cart.js functionality with robotic effects
    $(document).ready(function() {
      // Add loading effect to buttons
      $('.btn').on('click', function() {
        $(this).addClass('loading');
        setTimeout(() => {
          $(this).removeClass('loading');
        }, 2000);
      });

      // Update total display with glitch effect
      function updateTotalDisplay(total) {
        const totalElement = $('#selectedTotal');
        totalElement.attr('data-text', total);
        totalElement.text(total);
      }

      // Simulate cart loading
      setTimeout(function() {
        if ($('#cartContents').is(':empty')) {
          $('#cartContents').html(`
            <div class="empty-cart">
              <i class="bi bi-robot"></i>
              <h3>Your cart is empty</h3>
              <p>Add some items to get started!</p>
            </div>
          `);
        }
      }, 1000);
    });
  </script>
  <script src="js/cart.js"></script>
</body>
</html>
