<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js"
    integrity="sha512-LGHBR+kJ5jZSIzhhdfytPoEHzgaYuTRifq9g5l6ja6/k9NAOsAi5dQh4zQF6JIRB8cAYxTRedERUF+97/KuivQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/checkout.js"></script>
  <link rel="stylesheet" href="css/checkout.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      padding: 20px 0;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 60%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .cyber-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: -1;
      animation: gridShift 20s linear infinite;
    }

    @keyframes gridShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 30px); }
    }

    .checkout-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    .checkout-header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .checkout-header h1 {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(45deg, #38bdf8, #3b82f6, #8b5cf6, #a855f7);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .checkout-header p {
      color: #64748b;
      font-size: 1.1rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .main-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border: 2px solid;
      border-image: linear-gradient(45deg, #38bdf8, #8b5cf6) 1;
      position: relative;
      overflow: hidden;
      animation: slideUp 1s ease-out;
    }

    .main-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      animation: scanLine 2s linear infinite;
    }

    @keyframes scanLine {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-header {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      padding: 30px;
      text-align: center;
      position: relative;
      border-bottom: 1px solid #38bdf8;
    }

    .card-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #38bdf8, #8b5cf6, transparent);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .card-header h2 {
      font-family: 'Orbitron', monospace;
      color: #38bdf8;
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .card-body {
      padding: 40px;
      background: rgba(15, 23, 42, 0.4);
    }

    .section {
      margin-bottom: 40px;
      position: relative;
    }

    .section-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: #8b5cf6;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      padding-left: 30px;
    }

    .section-title::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 2px;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .section-title::after {
      content: '';
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
      50% { opacity: 0.5; transform: translateY(-50%) scale(1.2); }
    }

    .checkout-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 25px;
      margin-bottom: 20px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .checkout-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    .checkout-card:hover::before {
      transform: scaleX(1);
    }

    .checkout-card:hover {
      border-color: #38bdf8;
      box-shadow: 
        0 10px 30px rgba(56, 189, 248, 0.2),
        inset 0 1px 0 rgba(56, 189, 248, 0.1);
      transform: translateY(-3px);
    }
    
    .checkout-details h6 {
      margin-bottom: 10px;
      font-weight: 600;
      color: #e2e8f0;
      font-size: 1.1rem;
      font-family: 'Orbitron', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .checkout-details small {
      color: #94a3b8;
      font-weight: 400;
    }
    
    .checkout-details strong {
      color: #38bdf8;
      font-weight: 600;
      text-shadow: 0 0 5px rgba(56, 189, 248, 0.3);
    }

    .form-floating {
      margin-bottom: 25px;
      position: relative;
    }

    .form-select, .form-control {
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid rgba(56, 189, 248, 0.3);
      color: #e2e8f0;
      padding: 15px 20px;
      font-size: 1rem;
      transition: all 0.3s ease;
      font-family: 'Exo 2', sans-serif;
    }

    .form-select:focus, .form-control:focus {
      background: rgba(30, 41, 59, 0.9);
      border-color: #38bdf8;
      box-shadow: 
        0 0 0 3px rgba(56, 189, 248, 0.1),
        0 0 20px rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }

    .form-select option {
      background: #1e293b;
      color: #e2e8f0;
    }

    .form-label {
      font-weight: 500;
      color: #8b5cf6;
      font-family: 'Orbitron', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.9rem;
    }

    .totals-section {
      background: rgba(30, 41, 59, 0.6);
      border: 2px solid rgba(139, 92, 246, 0.4);
      padding: 30px;
      margin: 30px 0;
      position: relative;
      overflow: hidden;
    }

    .totals-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #8b5cf6, #38bdf8, #8b5cf6);
      background-size: 200% 100%;
      animation: flowGlow 3s linear infinite;
    }

    @keyframes flowGlow {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      font-size: 1.1rem;
      position: relative;
    }

    .total-row:last-child {
      border-bottom: none;
      padding-top: 25px;
      margin-top: 20px;
      font-weight: 700;
      font-size: 1.4rem;
      border-top: 2px solid rgba(56, 189, 248, 0.4);
      font-family: 'Orbitron', monospace;
    }

    .total-row strong {
      font-weight: 600;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .amount {
      font-weight: 700;
      color: #38bdf8;
      font-family: 'Orbitron', monospace;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .grand-total .amount {
      color: #8b5cf6;
      font-size: 1.6rem;
      text-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
    }

    .btn-confirm {
      background: linear-gradient(135deg, #8b5cf6 0%, #38bdf8 100%);
      border: 2px solid transparent;
      color: #ffffff;
      padding: 18px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      width: 100%;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Orbitron', monospace;
      cursor: pointer;
    }

    .btn-confirm::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.6s ease;
    }

    .btn-confirm::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 2px solid transparent;
      background: linear-gradient(45deg, #38bdf8, #8b5cf6) border-box;
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn-confirm:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 15px 35px rgba(139, 92, 246, 0.4),
        0 0 30px rgba(56, 189, 248, 0.3);
      background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
    }

    .btn-confirm:hover::before {
      left: 100%;
    }

    .btn-confirm:hover::after {
      opacity: 1;
    }

    .btn-confirm:active {
      transform: translateY(-1px);
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
      color: #64748b;
      font-size: 0.9rem;
      font-family: 'Orbitron', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .security-badge::before {
      content: '🛡️';
      filter: hue-rotate(200deg);
    }

    .empty-cart {
      text-align: center;
      padding: 80px 20px;
      color: #64748b;
    }

    .empty-cart-icon {
      font-size: 5rem;
      margin-bottom: 30px;
      opacity: 0.3;
    }

    @media (max-width: 768px) {
      .checkout-header h1 {
        font-size: 2.2rem;
      }
      
      .card-body {
        padding: 25px;
      }
      
      .main-card {
        margin: 0 10px;
      }
      
      .section-title {
        font-size: 1rem;
      }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, #38bdf8, #8b5cf6);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(45deg, #06b6d4, #a855f7);
    }
  </style>
</head>
<body>
<div class="cyber-grid"></div>
<div id="header"></div>

<div class="checkout-container">
  <div class="checkout-header">
    <h1>ORDER CHECKOUT</h1>
    <p>Initializing ROMEROS Order</p>
  </div>

  <div class="main-card">
    <div class="card-header">
      <h2>◄ SECURE TRANSACTION ►</h2>
    </div>
    
    <div class="card-body">
      <!-- Product List Section -->
      <div class="section">
        <h3 class="section-title">► Cart Analysis</h3>
        <div id="cartSummary"></div>
      </div>

      <!-- Shipping & Totals -->
      <form id="checkoutForm">
        <div class="section">
          <h3 class="section-title">► Delivery Protocol</h3>
          <div class="form-floating">
            <select id="shippingRegion" class="form-select" required>
              <option value="">-- Select Target Region --</option>
            </select>
            <label for="shippingRegion">Shipping Destination</label>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title">► Financial Summary</h3>
          <div class="totals-section">
            <div class="total-row">
              <strong>Items Subtotal:</strong>
              <span class="amount">₱<span id="itemsTotal">0.00</span></span>
            </div>
            <div class="total-row">
              <strong>Transport Fee:</strong>
              <span class="amount">₱<span id="shippingRate">0.00</span></span>
            </div>
            <div class="total-row grand-total">
              <strong>◄ Total Cost ►</strong>
              <span class="amount">₱<span id="grandTotal">0.00</span></span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-confirm">
          ◄ Execute Order ►
        </button>
        
        <div class="security-badge">
          Quantum-Encrypted Secure Channel
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// Add some cyberpunk-style interactions
document.addEventListener('DOMContentLoaded', function() {
  // Add typing effect to the header
  const header = document.querySelector('.checkout-header h1');
  if (header) {
    const text = header.textContent;
    header.textContent = '';
    let i = 0;
    const typeWriter = () => {
      if (i < text.length) {
        header.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 100);
      }
    };
    setTimeout(typeWriter, 500);
  }

  // Add glitch effect on button hover
  const confirmBtn = document.querySelector('.btn-confirm');
  if (confirmBtn) {
    confirmBtn.addEventListener('mouseenter', function() {
      this.style.animation = 'none';
      setTimeout(() => {
        this.style.animation = '';
      }, 10);
    });
  }
});
</script>
</body>
</html>
