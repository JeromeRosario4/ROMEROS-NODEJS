<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complete Profile</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Your custom CSS -->
  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 0;
  padding-top: 70px;
  overflow-x: hidden;
  min-height: 100vh;
}

.main-container {
  width: 100%;
  max-width: 600px;
  margin: 20px auto;
  background: #fff;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  box-sizing: border-box;
}

@media (max-width: 768px) {
  .main-container {
    margin: 20px 15px;
    padding: 20px;
  }
}

h2 {
  text-align: center;
  margin-top: 0;
  margin-bottom: 20px;
  color: #333;
}

form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.form-row {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.form-row input,
.form-row select {
  flex: 1;
  min-width: 200px;
}

@media (max-width: 480px) {
  .form-row {
    flex-direction: column;
  }

  .form-row input,
  .form-row select {
    min-width: auto;
  }
}

input,
select {
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
  width: 100%;
  box-sizing: border-box;
  transition: border-color 0.3s ease;
}

input:focus,
select:focus {
  outline: none;
  border-color: #ff4500;
  box-shadow: 0 0 5px rgba(255, 69, 0, 0.3);
}

button {
  padding: 12px 20px;
  border: 1px solid #ff4500;
  border-radius: 6px;
  font-size: 16px;
  background-color: #ff4500;
  color: white;
  cursor: pointer;
  transition: background-color 0.3s ease;
  margin-top: 10px;
}

button:hover {
  background-color: #e03e00;
}

button:active {
  transform: translateY(1px);
}

#profileImagePreview {
  display: block;
  margin: 20px auto;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #ddd;
  transition: border-color 0.3s ease;
}

#profileImagePreview:hover {
  border-color: #ff4500;
}

#profileMsg {
  text-align: center;
  margin-top: 15px;
  padding: 10px;
  border-radius: 5px;
  font-weight: 500;
}

#profileMsg.success {
  background-color: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}

#profileMsg.error {
  background-color: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}

input[type="file"] {
  padding: 8px;
  border: 2px dashed #ccc;
  background-color: #f9f9f9;
  cursor: pointer;
  transition: border-color 0.3s ease;
}

input[type="file"]:hover {
  border-color: #ff4500;
  background-color: #fff;
}

input:invalid {
  border-color: #dc3545;
}

input:valid {
  border-color: #28a745;
}

button:disabled {
  background-color: #6c757d;
  cursor: not-allowed;
  opacity: 0.6;
}

* {
  transition: all 0.2s ease;
}
</style>
</head>
<body>
 <div id="header"></div>

  <!-- Page Content -->
  <div class="container form mt-5 pt-5">
    <h2>Complete Your Profile</h2>
    <img id="profileImagePreview" src="https://via.placeholder.com/120" alt="Profile Picture" />

    <form id="profileForm" enctype="multipart/form-data">
      <select name="title" id="title" class="form-select mb-3">
        <option value="">Select Title</option>
        <option value="Mr.">Mr.</option>
        <option value="Ms.">Ms.</option>
        <option value="Mrs.">Mrs.</option>
      </select>

      <input type="hidden" name="userId" id="userId" />

      <div class="form-row mb-3">
        <input type="text" name="fname" id="fname" placeholder="First Name" class="form-control mb-2" required />
        <input type="text" name="lname" id="lname" placeholder="Last Name" class="form-control" required />
      </div>

      <div class="form-row mb-3">
        <input type="text" name="addressline" id="addressline" placeholder="Address" class="form-control mb-2" />
        <input type="text" name="town" id="town" placeholder="Town" class="form-control" />
      </div>

      <div class="form-row mb-3">
        <input type="text" name="phone" id="phone" placeholder="Phone" class="form-control mb-2" />
        <input type="file" name="image" id="image" accept="image/*" class="form-control" />
      </div>

      <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
    
    <p id="profileMsg" class="mt-3"></p>
  </div>

  <script>
    $(document).ready(function () {
      const token = localStorage.getItem('token');
      const userId = localStorage.getItem('userId');

      if (!token || !userId) {
        alert("You must be logged in first!");
        window.location.href = '/login.html';
        return;
      }

      // Force-load header
      $('#header').load('/header.html', function (response, status, xhr) {
        if (status == "error") {
          console.error("Failed to load header:", xhr.status, xhr.statusText);
        } else {
          // FIX: Enable dropdown
          document.querySelectorAll('[data-bs-toggle="dropdown"]').forEach(function (el) {
            new bootstrap.Dropdown(el);
          });

          // Adjust header links
          $('#login-link, #register-link').addClass('d-none');
          $('#user-dropdown').removeClass('d-none');

          // Set user data in header
          $.get(`/api/users/customers/${userId}`, function (res) {
            if (res.success && res.data) {
              const data = res.data;
              const fullName = `${data.fname || ''} ${data.lname || ''}`.trim();
              $('#username').text(fullName || 'USER');
              if (data.image_path) {
                $('.profile-img').attr('src', `/${data.image_path}`);
              }
            }
          });
        }
      });

      $('#userId').val(userId);

      fetchProfileData(userId);

      function fetchProfileData(userId) {
        $.ajax({
          url: `/api/users/customers/${userId}`,
          method: 'GET',
          success: function (res) {
            if (res.success && res.data) {
              const data = res.data;
              $('#title').val(data.title || '');
              $('#fname').val(data.fname || '');
              $('#lname').val(data.lname || '');
              $('#addressline').val(data.addressline || '');
              $('#town').val(data.town || '');
              $('#phone').val(data.phone || '');
              if (data.image_path) {
                $('#profileImagePreview').attr('src', `/${data.image_path}`);
              }
            }
          },
          error: function () {
            console.warn('No profile found.');
          }
        });
      }

      $('#image').on('change', function () {
        const file = this.files[0];
        if (file) {
          $('#profileImagePreview').attr('src', URL.createObjectURL(file));
        }
      });

      $('#profileForm').on('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        formData.set('userId', userId);

        $.ajax({
          url: '/api/users/update-profile',
          method: 'POST',
          data: formData,
          contentType: false,
          processData: false,
          success: function () {
            $('#profileMsg').text(' Profile saved!').css('color', 'green');
            fetchProfileData(userId);
          },
          error: function (err) {
            $('#profileMsg').text(' Failed to save.').css('color', 'red');
            console.error(err);
          }
        });
      });
    });
  </script>
</body>
</html>
