  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Profile - ROMEROS</title>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <!-- SweetAlert2 for prompts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
      body {
  font-family: 'Orbitron', 'Arial', sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
  position: relative;
  }

  body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background:
  radial-gradient(circle at 20% 80%, rgba(157, 78, 221, 0.1) 0%, transparent 50%),
  radial-gradient(circle at 80% 20%, rgba(123, 44, 191, 0.1) 0%, transparent 50%);
  z-index: -1;
  }

  .main-container {
  padding-top: 100px;
  padding-bottom: 50px;
  min-height: 100vh;
  position: relative;
  }

  .profile-wrapper {
  background: linear-gradient(145deg, rgba(26, 26, 46, 0.9), rgba(22, 33, 62, 0.9));
  border: 1px solid rgba(157, 78, 221, 0.3);
  border-radius: 24px;
  backdrop-filter: blur(20px);
  box-shadow:
  0 20px 40px rgba(0, 0, 0, 0.3),
  0 0 0 1px rgba(157, 78, 221, 0.1),
  inset 0 1px 0 rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
  max-width: 800px;
  margin: 0 auto;
  }

  .profile-wrapper::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #9d4edd, transparent);
  animation: scan-line 4s linear infinite;
  }

  @keyframes scan-line {
  0% { left: -100%; }
  100% { left: 100%; }
  }

  .profile-header {
  text-align: center;
  padding: 40px 30px 30px;
  background: linear-gradient(135deg, rgba(157, 78, 221, 0.1), rgba(123, 44, 191, 0.1));
  border-bottom: 1px solid rgba(157, 78, 221, 0.2);
  position: relative;
  }

  .profile-title {
  font-size: 2.5rem;
  font-weight: 900;
  color: #9d4edd;
  text-shadow: 0 0 20px rgba(157, 78, 221, 0.8);
  margin-bottom: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: linear-gradient(45deg, #9d4edd, #7b2cbf, #9d4edd);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradient-shift 3s ease-in-out infinite;
  }

  @keyframes gradient-shift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  }

  .profile-subtitle {
  color: rgba(157, 78, 221, 0.7);
  font-size: 1.1rem;
  font-weight: 400;
  letter-spacing: 1px;
  }

  .profile-form-container {
  padding: 40px;
  }

  .profile-image-section {
  text-align: center;
  margin-bottom: 40px;
  position: relative;
  }

  .profile-image-wrapper {
  position: relative;
  display: inline-block;
  margin-bottom: 20px;
  }

  .profile-image {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 4px solid #9d4edd;
  box-shadow:
  0 0 30px rgba(157, 78, 221, 0.6),
  inset 0 0 20px rgba(0, 0, 0, 0.2);
  object-fit: cover;
  transition: all 0.3s ease;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  }

  .profile-image:hover {
  box-shadow:
  0 0 40px rgba(157, 78, 221, 0.8),
  inset 0 0 20px rgba(0, 0, 0, 0.2);
  transform: scale(1.05);
  }

  .image-upload-overlay {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: linear-gradient(135deg, #9d4edd, #7b2cbf);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
  }

  .image-upload-overlay:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
  }

  .form-group {
  margin-bottom: 30px;
  }

  .form-label {
  color: #9d4edd;
  font-weight: 600;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  }

  .form-control, .form-select {
  background: rgba(26, 26, 46, 0.8);
  border: 2px solid rgba(157, 78, 221, 0.3);
  border-radius: 12px;
  color: #fff;
  padding: 15px 20px;
  font-size: 1rem;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
  }

  .form-control:focus, .form-select:focus {
  background: rgba(26, 26, 46, 0.9);
  border-color: #9d4edd;
  box-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
  color: #fff;
  }

  .form-control::placeholder {
  color: rgba(157, 78, 221, 0.5);
  }

  .form-select option {
  background: #1a1a2e;
  color: #fff;
  }

  .row-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  }

  @media (max-width: 768px) {
  .row-group {
  grid-template-columns: 1fr;
  }
  }

  .btn-futuristic {
  background: linear-gradient(135deg, #9d4edd, #7b2cbf);
  border: none;
  border-radius: 12px;
  color: #fff;
  padding: 15px 30px;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(157, 78, 221, 0.4);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  }

  .btn-futuristic::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s ease;
  }

  .btn-futuristic:hover::before {
  left: 100%;
  }

  .btn-futuristic:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 35px rgba(157, 78, 221, 0.6);
  background: linear-gradient(135deg, #7b2cbf, #9d4edd);
  }

  .btn-danger-futuristic {
  background: linear-gradient(135deg, #ff006e, #fb5607);
  box-shadow: 0 8px 25px rgba(255, 0, 110, 0.4);
  }

  .btn-danger-futuristic:hover {
  background: linear-gradient(135deg, #fb5607, #ff006e);
  box-shadow: 0 12px 35px rgba(255, 0, 110, 0.6);
  }

  .button-group {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 40px;
  }

  @media (max-width: 576px) {
  .button-group {
  flex-direction: column;
  }
  }

  .alert-futuristic {
  background: linear-gradient(135deg, rgba(157, 78, 221, 0.1), rgba(123, 44, 191, 0.1));
  border: 1px solid rgba(157, 78, 221, 0.3);
  border-radius: 12px;
  color: #9d4edd;
  padding: 15px 20px;
  margin-top: 20px;
  backdrop-filter: blur(10px);
  }

  .alert-success {
  background: linear-gradient(135deg, rgba(40, 167, 69, 0.1), rgba(25, 135, 84, 0.1));
  border-color: rgba(40, 167, 69, 0.3);
  color: #28a745;
  }

  .alert-danger {
  background: linear-gradient(135deg, rgba(220, 53, 69, 0.1), rgba(255, 0, 110, 0.1));
  border-color: rgba(220, 53, 69, 0.3);
  color: #dc3545;
  }

  .alert-warning {
  background: linear-gradient(135deg, rgba(255, 193, 7, 0.1), rgba(251, 86, 7, 0.1));
  border-color: rgba(255, 193, 7, 0.3);
  color: #ffc107;
  }

  .loading-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
  }

  @keyframes spin {
  to { transform: rotate(360deg); }
  }

  .file-input-wrapper {
  position: relative;
  overflow: hidden;
  display: inline-block;
  width: 100%;
  }

  .file-input-wrapper input[type=file] {
  position: absolute;
  left: -9999px;
  }

  .file-input-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px 20px;
  background: rgba(26, 26, 46, 0.8);
  border: 2px dashed rgba(157, 78, 221, 0.5);
  border-radius: 12px;
  color: rgba(157, 78, 221, 0.8);
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: center;
  justify-content: center;
  }

  .file-input-label:hover {
  border-color: #9d4edd;
  color: #9d4edd;
  background: rgba(157, 78, 221, 0.1);
  }

  /* Animations for form elements */
  .form-group {
  opacity: 0;
  transform: translateY(20px);
  animation: slideInUp 0.6s ease forwards;
  }

  .form-group:nth-child(1) { animation-delay: 0.1s; }
  .form-group:nth-child(2) { animation-delay: 0.2s; }
  .form-group:nth-child(3) { animation-delay: 0.3s; }
  .form-group:nth-child(4) { animation-delay: 0.4s; }
  .form-group:nth-child(5) { animation-delay: 0.5s; }

  @keyframes slideInUp {
  to {
  opacity: 1;
  transform: translateY(0);
  }
  }
    </style>
  </head>
  <body>
    <!-- Header placeholder -->
    <div id="header">Loading header...</div>

    <!-- Main Content -->
    <div class="main-container">
      <div class="container">
        <div class="profile-wrapper">
          <!-- Profile Header -->
          <div class="profile-header">
            <h1 class="profile-title">Profile Setup</h1>
            <p class="profile-subtitle">Complete your account information</p>
          </div>

          <!-- Profile Form -->
          <div class="profile-form-container">
            <!-- Profile Image Section -->
            <div class="profile-image-section">
              <div class="profile-image-wrapper">
                <img id="profileImagePreview" src="https://via.placeholder.com/150/9d4edd/ffffff?text=👤" alt="Profile Picture" class="profile-image" />
                <div class="image-upload-overlay" onclick="document.getElementById('image').click()">
                  <i class="fas fa-camera"></i>
                </div>
              </div>
            </div>

            <form id="profileForm" enctype="multipart/form-data">
              <input type="hidden" name="userId" id="userId" />

              <!-- Title Selection -->
              <div class="form-group">
                <label class="form-label">
                  <i class="fas fa-user-tag"></i>
                  Title
                </label>
                <select name="title" id="title" class="form-select">
                  <option value="">Select Title</option>
                  <option value="Mr.">Mr.</option>
                  <option value="Ms.">Ms.</option>
                  <option value="Mrs.">Mrs.</option>
                </select>
              </div>

              <!-- Name Fields -->
              <div class="form-group">
                <label class="form-label">
                  <i class="fas fa-id-card"></i>
                  Full Name
                </label>
                <div class="row-group">
                  <input type="text" name="fname" id="fname" placeholder="First Name" class="form-control" required />
                  <input type="text" name="lname" id="lname" placeholder="Last Name" class="form-control" required />
                </div>
              </div>

              <!-- Address Fields -->
              <div class="form-group">
                <label class="form-label">
                  <i class="fas fa-map-marker-alt"></i>
                  Address Information
                </label>
                <div class="row-group">
                  <input type="text" name="addressline" id="addressline" placeholder="Street Address" class="form-control" />
                  <input type="text" name="town" id="town" placeholder="City/Town" class="form-control" />
                </div>
              </div>

              <!-- Phone Field -->
              <div class="form-group">
                <label class="form-label">
                  <i class="fas fa-phone"></i>
                  Contact Number
                </label>
                <input type="text" name="phone" id="phone" placeholder="Phone Number" class="form-control" />
              </div>

              <!-- File Upload -->
              <div class="form-group">
                <label class="form-label">
                  <i class="fas fa-image"></i>
                  Profile Picture
                </label>
                <div class="file-input-wrapper">
                  <input type="file" name="image" id="image" accept="image/*" />
                  <label for="image" class="file-input-label">
                    <i class="fas fa-cloud-upload-alt"></i>
                    Choose Profile Image
                  </label>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="button-group">
                <button type="submit" class="btn-futuristic">
                  <i class="fas fa-save"></i>
                  Save Profile
                </button>
                <button type="button" id="deactivateBtn" class="btn-futuristic btn-danger-futuristic">
                  <i class="fas fa-user-times"></i>
                  Deactivate Account
                </button>
              </div>
            </form>

            <!-- Message Display -->
            <div id="profileMsg" class="alert-futuristic" style="display: none;"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      $(document).ready(function() {
        // Load header
        $('#header').load('/header.html', function() {
          console.log('Header loaded successfully');
          
          // Initialize profile page after header loads
          initializeProfilePage();
        });

        // Get the current authenticated user ID
        function getAuthenticatedUserId() {
          // IMPORTANT: Replace this with your actual authentication system
          // This is just a placeholder - in a real app, you would:
          // 1. Get the ID from your session system
          // 2. Verify the user is actually logged in
          // 3. Return the authenticated user's ID
          
          // For demo purposes, we'll get it from sessionStorage
          // In your login system, you should set this when user logs in:
          // sessionStorage.setItem('currentUserId', user.id);
          return sessionStorage.getItem('currentUserId');
        }

        function initializeProfilePage() {
          const userId = getAuthenticatedUserId();
          
          if (!userId) {
            showMessage('Please log in to access your profile', 'warning');
            return;
          }

          // Set the user ID in the form
          $('#userId').val(userId);
          
          // Load profile data for this specific user
          loadUserProfile(userId);

          // Set up form submission handler
          setupFormSubmission(userId);
          
          // Set up deactivate button handler
          setupDeactivateButton(userId);
          
          // Set up image preview handler
          setupImagePreview();
        }

        function loadUserProfile(userId) {
          try {
            const profileKey = `userProfile_${userId}`;
            const savedProfile = localStorage.getItem(profileKey) || 
                              sessionStorage.getItem(profileKey);
            
            if (savedProfile) {
              const user = JSON.parse(savedProfile);
              
              // Verify the data belongs to this user
              if (user.userId === userId) {
                $('#title').val(user.title || '');
                $('#fname').val(user.fname || '');
                $('#lname').val(user.lname || '');
                $('#addressline').val(user.addressline || '');
                $('#town').val(user.town || '');
                $('#phone').val(user.phone || '');
                
                if (user.profileImage && user.profileImage !== 'https://via.placeholder.com/150/9d4edd/ffffff?text=👤') {
                  $('#profileImagePreview').attr('src', user.profileImage);
                }
                
                if (user.lastUpdated) {
                  const lastUpdated = new Date(user.lastUpdated).toLocaleString();
                  showMessage(`Profile loaded - Last updated: ${lastUpdated}`, 'success');
                }
                
                if (user.status === 'deactivated') {
                  showMessage('This account is deactivated', 'warning');
                }
              } else {
                console.error('Profile data does not match current user');
                showMessage('New profile - please complete your information', 'info');
              }
            } else {
              showMessage('Please complete your profile information', 'info');
            }
          } catch (error) {
            console.error('Error loading profile:', error);
            showMessage('Error loading profile data', 'danger');
          }
        }

        function setupFormSubmission(userId) {
          $('#profileForm').on('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = $(this).find('button[type="submit"]');
            const originalText = submitBtn.html();
            
            submitBtn.html('<div class="loading-spinner"></div> Saving...');
            submitBtn.prop('disabled', true);
            
            setTimeout(() => {
              try {
                const profileKey = `userProfile_${userId}`;
                const customerKey = `customerData_${userId}`;
                
                // Collect form data
                const profileData = {
                  userId: userId,
                  title: $('#title').val(),
                  fname: $('#fname').val().trim(),
                  lname: $('#lname').val().trim(),
                  addressline: $('#addressline').val().trim(),
                  town: $('#town').val().trim(),
                  phone: $('#phone').val().trim(),
                  profileImage: $('#profileImagePreview').attr('src'),
                  lastUpdated: new Date().toISOString(),
                  status: 'active'
                };

                // Validate required fields
                if (!profileData.fname || !profileData.lname) {
                  throw new Error('First Name and Last Name are required');
                }

                // Save to storage with user-specific key
                localStorage.setItem(profileKey, JSON.stringify(profileData));
                sessionStorage.setItem(profileKey, JSON.stringify(profileData));
                
                // Update customer data
                updateCustomerData(profileData, customerKey);
                
                submitBtn.html(originalText);
                submitBtn.prop('disabled', false);
                showMessage('Profile saved successfully!', 'success');
                
              } catch (error) {
                submitBtn.html(originalText);
                submitBtn.prop('disabled', false);
                showMessage('Error: ' + error.message, 'danger');
              }
            }, 1500);
          });
        }

        function updateCustomerData(profileData, customerKey) {
          try {
            let customerData = JSON.parse(localStorage.getItem(customerKey)) || {};
            
            customerData = {
              userId: profileData.userId,
              id: customerData.id || Date.now(),
              name: `${profileData.title ? profileData.title + ' ' : ''}${profileData.fname} ${profileData.lname}`.trim(),
              email: customerData.email || `${profileData.fname.toLowerCase()}.${profileData.lname.toLowerCase()}@example.com`,
              phone: profileData.phone || 'Not provided',
              address: `${profileData.addressline ? profileData.addressline + ', ' : ''}${profileData.town || ''}`.trim() || 'Not provided',
              profileImage: profileData.profileImage,
              status: profileData.status || 'active',
              lastUpdated: profileData.lastUpdated,
              dateAdded: customerData.dateAdded || new Date().toISOString()
            };
            
            localStorage.setItem(customerKey, JSON.stringify(customerData));
            sessionStorage.setItem(customerKey, JSON.stringify(customerData));
            
          } catch (error) {
            console.error('Error updating customer data:', error);
          }
        }

        function setupDeactivateButton(userId) {
          $('#deactivateBtn').on('click', function() {
            Swal.fire({
              title: 'Are you sure?',
              text: "This will deactivate your account!",
              icon: 'warning',
              showCancelButton: true,
              confirmButtonColor: '#ff006e',
              cancelButtonColor: '#9d4edd',
              confirmButtonText: 'Yes, deactivate it!',
              background: '#1a1a2e',
              color: '#fff'
            }).then((result) => {
              if (result.isConfirmed) {
                try {
                  const profileKey = `userProfile_${userId}`;
                  const customerKey = `customerData_${userId}`;
                  
                  // Update profile status
                  const profileData = JSON.parse(localStorage.getItem(profileKey) || '{}');
                  profileData.status = 'deactivated';
                  profileData.deactivatedAt = new Date().toISOString();
                  localStorage.setItem(profileKey, JSON.stringify(profileData));
                  sessionStorage.setItem(profileKey, JSON.stringify(profileData));
                  
                  // Update customer status
                  const customerData = JSON.parse(localStorage.getItem(customerKey) || {});
                  customerData.status = 'deactivated';
                  customerData.deactivatedAt = new Date().toISOString();
                  localStorage.setItem(customerKey, JSON.stringify(customerData));
                  sessionStorage.setItem(customerKey, JSON.stringify(customerData));
                  
                  showMessage('Account deactivated', 'warning');
                  
                  // Clear form
                  setTimeout(() => {
                    $('#profileForm')[0].reset();
                    $('#profileImagePreview').attr('src', 'https://via.placeholder.com/150/9d4edd/ffffff?text=👤');
                    $('.file-input-label').html(`
                      <i class="fas fa-cloud-upload-alt"></i>
                      Choose Profile Image
                    `);
                  }, 2000);
                  
                } catch (error) {
                  showMessage('Error deactivating account', 'danger');
                }
              }
            });
          });
        }

        function setupImagePreview() {
          $('#image').on('change', function(e) {
            const file = e.target.files[0];
            if (file) {
              // Validate file type
              const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
              if (!allowedTypes.includes(file.type)) {
                showMessage('Invalid file type. Please select JPG, PNG, or GIF images only.', 'danger');
                this.value = '';
                return;
              }
              
              // Validate file size (5MB max)
              if (file.size > 5 * 1024 * 1024) {
                showMessage('File size too large. Maximum 5MB allowed.', 'danger');
                this.value = '';
                return;
              }
              
              const reader = new FileReader();
              reader.onload = function(e) {
                $('#profileImagePreview').attr('src', e.target.result);
              }
              reader.readAsDataURL(file);
              
              // Update file input label
              $('.file-input-label').html(`
                <i class="fas fa-check-circle"></i>
                ${file.name}
              `);
            }
          });
        }

        function showMessage(message, type) {
          const msgEl = $('#profileMsg');
          msgEl.removeClass('alert-success alert-warning alert-danger alert-info')
            .addClass(`alert-${type}`)
            .html(message)
            .fadeIn();
          
          setTimeout(() => {
            msgEl.fadeOut();
          }, 5000);
        }
      });
    </script>
  </body>
  </html>
