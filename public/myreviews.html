<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js"
    integrity="sha512-LGHBR+kJ5jZSIzhhdfytPoEHzgaYuTRifq9g5l6ja6/k9NAOsAi5dQh4zQF6JIRB8cAYxTRedERUF+97/KuivQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/myreviews.css">
  <style>
    /* Custom styles for review display */
    .review-card {
      transition: all 0.3s ease;
    }
    .review-card:hover {
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
    .review-card.deleted {
      background-color: #f8f9fa;
      opacity: 0.8;
      border-left: 4px solid #ffc107;
    }
    .review-images {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    .review-image {
      width: 100px;
      height: 100px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.2s;
    }
    .review-image:hover {
      transform: scale(1.05);
    }
    .rating-stars i {
      cursor: pointer;
      font-size: 1.5rem;
      color: #ffc107;
    }
    .badge.deleted-badge {
      font-size: 0.8rem;
    }
    .image-modal {
      max-width: 100%;
      max-height: 70vh;
    }
    .no-reviews {
      text-align: center;
      padding: 3rem;
      color: #6c757d;
    }
    .restore-btn {
      position: relative;
      overflow: hidden;
    }
    .restore-btn::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(30deg);
      transition: all 0.3s;
    }
    .restore-btn:hover::after {
      left: 100%;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="fas fa-star text-warning me-2"></i>My Reviews</h2>
      <div>
        <a href="/myorders.html" class="btn btn-outline-primary me-2">
          <i class="fas fa-arrow-left me-2"></i>Back to Orders
        </a>
      </div>
    </div>
    
    <div class="alert alert-info mb-3">
      <i class="fas fa-info-circle me-2"></i>
      Deleted reviews are marked with a yellow badge and can be restored.
    </div>
    
    <div id="reviewsList"></div>
  </div>

  <!-- Image Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="imageModalLabel">Review Image</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <img id="modalImage" src="" alt="Review Image" class="img-fluid">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Review Modal -->
  <div class="modal fade" id="editReviewModal" tabindex="-1" aria-labelledby="editReviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editReviewModalLabel">Edit Review</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editReviewForm">
          <div class="modal-body">
            <input type="hidden" id="editReviewId">
            
            <div class="mb-3">
              <label for="editRating" class="form-label">Rating</label>
              <div class="rating-stars mb-2">
                <i class="far fa-star" data-rating="1"></i>
                <i class="far fa-star" data-rating="2"></i>
                <i class="far fa-star" data-rating="3"></i>
                <i class="far fa-star" data-rating="4"></i>
                <i class="far fa-star" data-rating="5"></i>
                <input type="hidden" id="editRating" name="rating" value="0">
                <span id="editRatingDescription" class="ms-2 text-muted">Not rated</span>
              </div>
            </div>
            
            <div class="mb-3">
              <label for="editReviewText" class="form-label">Review</label>
              <textarea class="form-control" id="editReviewText" name="review_text" rows="5" required></textarea>
              <div class="form-text">Minimum 20 characters</div>
            </div>
            
            <div class="mb-3">
              <label for="editReviewImages" class="form-label">Update Images (optional)</label>
              <input type="file" id="editReviewImages" name="images" accept="image/jpeg,image/png" multiple class="form-control">
              <div class="form-text">Max 5 images (JPEG or PNG)</div>
              <div id="editImagePreview" class="mt-2 d-flex flex-wrap gap-2"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">
              <span class="submit-text">Save Changes</span>
              <span class="spinner-border spinner-border-sm d-none"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Restore Confirmation Modal -->
  <div class="modal fade" id="restoreConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"><i class="fas fa-undo me-2"></i>Restore Review</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to restore this review?</p>
          <p class="small text-muted"><i class="fas fa-info-circle me-1"></i>The review will be visible to others again.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirmRestoreBtn" class="btn btn-success">
            <i class="fas fa-undo me-1"></i>Restore
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/myreviews.js"></script>
  <script>
    // Additional JavaScript for toggling deleted reviews visibility
    $(document).ready(function() {
      let showDeleted = true;
      
      $('#toggleDeletedBtn').click(function() {
        showDeleted = !showDeleted;
        $(this).html(`
          <i class="fas ${showDeleted ? 'fa-eye-slash' : 'fa-eye'} me-2"></i>
          ${showDeleted ? 'Hide' : 'Show'} Deleted
        `);
        
        if (showDeleted) {
          $('.review-card.deleted').show();
        } else {
          $('.review-card.deleted').hide();
        }
      });
    });
    
    // Global function for showing image modal
    window.showImageModal = function(imageSrc) {
      $('#modalImage').attr('src', imageSrc);
      $('#imageModal').modal('show');
    };
  </script>
</body>
</html>
