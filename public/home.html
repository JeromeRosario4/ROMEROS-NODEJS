<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROMEROS KINGDOM</title>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-purple: #8b5cf6;
      --dark-purple: #6d28d9;
      --light-purple: #a78bfa;
      --accent-blue: #3b82f6;
      --light-blue: #60a5fa;
      --dark-bg: #0f0f23;
      --card-bg: #1e1b4b;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --border-color: rgba(139, 92, 246, 0.3);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--dark-bg) 0%, #1e1b4b 100%);
      color: var(--text-white);
      min-height: 100vh;
    }

    /* Header */
    #header {
      height: 70px;
      background: rgba(30, 27, 75, 0.9);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Hero Section */
    .hero {
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(135deg, var(--card-bg) 0%, var(--dark-purple) 100%);
    }

    .hero h2 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .container h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      text-align: center;
      margin-bottom: 50px;
      color: var(--primary-purple);
      font-weight: 600;
    }

    /* Category Filter */
    .category-filter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .category-btn {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .category-btn:hover, .category-btn.active {
      background: var(--primary-purple);
      border-color: var(--primary-purple);
    }

    /* Products Grid */
    .products-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary-purple);
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
    }

    /* Product Image Gallery */
    .product-image-gallery {
      position: relative;
      height: 250px;
      overflow: hidden;
    }

    .product-image-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .product-image {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .product-image.active {
      opacity: 1;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.05);
    }

    /* Gallery Navigation */
    .gallery-nav {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .gallery-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .gallery-dot.active {
      background: var(--primary-purple);
      transform: scale(1.2);
    }

    .gallery-dot:hover {
      background: var(--light-purple);
    }

    /* Gallery Arrows */
    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .product-card:hover .gallery-arrow {
      opacity: 1;
    }

    .gallery-arrow:hover {
      background: rgba(139, 92, 246, 0.8);
    }

    .gallery-arrow.prev {
      left: 10px;
    }

    .gallery-arrow.next {
      right: 10px;
    }

    /* Image Counter */
    .image-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      z-index: 10;
    }

    .product-info {
      padding: 20px;
    }

    .product-category {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(139, 92, 246, 0.2);
      color: var(--light-purple);
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-white);
      font-weight: 600;
    }

    .product-price {
      font-size: 1.3rem;
      color: var(--primary-purple);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .product-stock {
      color: var(--text-gray);
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .quantity-input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-white);
      text-align: center;
      margin-bottom: 12px;
    }

    .quantity-input:focus {
      outline: none;
      border-color: var(--primary-purple);
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-add-cart {
      flex: 1;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      background: var(--primary-purple);
      color: white;
    }

    .btn-add-cart:hover {
      background: var(--dark-purple);
    }

    .btn-view-details {
      flex: 1;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.3s ease;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      background: var(--accent-blue);
      color: white;
    }

    .btn-view-details:hover {
      background: var(--light-blue);
    }

    /* Modal Customization */
    .modal-content {
      background-color: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
    }

    .modal-header {
      border-bottom: 1px solid var(--border-color);
    }

    .modal-footer {
      border-top: 1px solid var(--border-color);
    }

    .btn-close {
      filter: invert(1);
    }

    .product-description {
      color: var(--text-gray);
      margin-bottom: 20px;
    }

    /* Modal Image Gallery */
    .modal-image-gallery {
      position: relative;
      height: 350px;
      overflow: hidden;
      border-radius: 8px;
    }

    .modal-image-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .modal-gallery-nav {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .modal-gallery-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .modal-gallery-dot.active {
      background: var(--primary-purple);
      transform: scale(1.2);
    }

    .modal-gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .modal-gallery-arrow:hover {
      background: rgba(139, 92, 246, 0.8);
    }

    .modal-gallery-arrow.prev {
      left: 15px;
    }

    .modal-gallery-arrow.next {
      right: 15px;
    }

    /* Reviews Section Styles */
    .reviews-container {
      max-height: 300px;
      overflow-y: auto;
      padding-right: 10px;
    }
    
    .review-card {
      background-color: rgba(30, 27, 75, 0.5);
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
      border-radius: 8px;
    }
    
    .rating {
      font-size: 1rem;
    }
    
    .text-purple {
      color: var(--primary-purple);
    }
    
    .bg-purple {
      background-color: var(--primary-purple);
    }

    .review-author {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .review-date {
      font-size: 0.8rem;
      color: var(--text-gray);
    }

    .review-text {
      margin-top: 10px;
    }

    .no-reviews {
      text-align: center;
      padding: 20px;
      color: var(--text-gray);
    }

    .reviews-title {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .text-warning {
      color: #ffc107 !important;
    }
    
    /* Review Images Styles */
    .review-images-container {
      margin-top: 10px;
    }

    .review-images-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .review-image-thumbnail {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
    }

    .review-image-thumbnail:hover {
      transform: scale(1.05);
      border-color: var(--light-purple);
    }

    .review-image-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .review-image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .review-image-modal.active {
      opacity: 1;
      pointer-events: all;
    }

    .review-image-modal-content {
      max-width: 90%;
      max-height: 90%;
    }

    .review-image-modal-content img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    .review-image-modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="header"></div>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h2>ROMEROS KINGDOM</h2>
      </div>
    </section>

    <div class="container" id="items">
      <h1>Shop Products</h1>
      <div class="category-filter" id="categoryFilter">
        <!-- Categories will be loaded here -->
      </div>
      <div class="products-grid-container"></div>
    </div>
  </main>

  <!-- Product Details Modal with Enhanced Image Gallery -->
  <div class="modal fade" id="productDetailsModal" tabindex="-1" aria-labelledby="productDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productDetailsModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <div class="modal-image-gallery">
                <div class="modal-image-container" id="modalImageContainer">
                  <!-- Modal images will be inserted here -->
                </div>
                <button class="modal-gallery-arrow prev" id="modalPrevBtn">
                  <i class="fas fa-chevron-left"></i>
                </button>
                <button class="modal-gallery-arrow next" id="modalNextBtn">
                  <i class="fas fa-chevron-right"></i>
                </button>
                <div class="modal-gallery-nav" id="modalGalleryNav">
                  <!-- Modal navigation dots will be inserted here -->
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <h4 id="modalProductName"></h4>
                <p class="product-description" id="modalProductDescription"></p>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <div>
                  <span class="badge bg-purple" id="modalProductCategory"></span>
                </div>
                <div>
                  <span class="text-muted">Stock: </span>
                  <span id="modalProductStock"></span>
                </div>
              </div>
              <div class="mb-4">
                <h3 class="text-purple" id="modalProductPrice"></h3>
              </div>
              <div class="input-group mb-3">
                <input type="number" class="form-control" id="modalQuantityInput" min="1" value="1">
                <button class="btn btn-primary" type="button" id="modalAddToCart">
                  <i class="fas fa-shopping-cart me-2"></i>Add to Cart
                </button>
              </div>
            </div>
          </div>
          
          <!-- Reviews Section -->
          <div class="mt-5">
            <h5 class="reviews-title">Customer Reviews</h5>
            <div id="productReviews" class="reviews-container">
              <!-- Reviews will be loaded here dynamically -->
            </div>
            <div id="noReviewsMessage" class="no-reviews">
              No reviews yet. Be the first to review this product!
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Review Image Modal (for enlarged view) -->
  <div class="review-image-modal" id="reviewImageModal">
    <span class="review-image-modal-close">&times;</span>
    <div class="review-image-modal-content">
      <img id="enlargedReviewImage" src="" alt="Enlarged review image">
    </div>
  </div>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(function () {
      $("#header").load("header.html");
    });

    $(document).ready(function () {
      const url = 'http://localhost:3000/';
      const imageBaseUrl = 'http://localhost:3000/uploads/reviews/'; 
      var itemCount = 0;
      var currentCategory = 'all';
      const productModal = new bootstrap.Modal(document.getElementById('productDetailsModal'));

      const getCart = () => {
          let cart = localStorage.getItem('cart');
          return cart ? JSON.parse(cart) : [];
      }

      const saveCart = (cart) => {
          localStorage.setItem('cart', JSON.stringify(cart));
      }

      const isUserLoggedIn = () => {
          const token = localStorage.getItem('token');
          const userId = localStorage.getItem('userId');
          return token && userId;
      }

      // Image Gallery Management
      class ImageGallery {
        constructor(container, images, isModal = false) {
          this.container = container;
          this.images = images;
          this.currentIndex = 0;
          this.isModal = isModal;
          this.init();
        }

        init() {
          this.createImageElements();
          this.createNavigation();
          this.bindEvents();
          this.showImage(0);
          this.startAutoRotate();
        }

        createImageElements() {
          const imageContainer = this.isModal ? 
            this.container.find('.modal-image-container') : 
            this.container.find('.product-image-container');
          
          imageContainer.empty();
          
          this.images.forEach((image, index) => {
            const imgElement = `
              <div class="product-image ${index === 0 ? 'active' : ''}">
                <img src="${imageBaseUrl}${image}" alt="Product Image ${index + 1}" 
                     onerror="this.src='${imageBaseUrl}placeholder.jpg'; this.onerror=null;">
              </div>
            `;
            imageContainer.append(imgElement);
          });
        }

        createNavigation() {
          // Create dots
          const navContainer = this.isModal ? 
            this.container.find('.modal-gallery-nav') : 
            this.container.find('.gallery-nav');
          
          navContainer.empty();
          
          this.images.forEach((_, index) => {
            const dotClass = this.isModal ? 'modal-gallery-dot' : 'gallery-dot';
            const dot = `<div class="${dotClass} ${index === 0 ? 'active' : ''}" data-index="${index}"></div>`;
            navContainer.append(dot);
          });

          // Add image counter for card view
          if (!this.isModal) {
            const counter = `<div class="image-counter">1 / ${this.images.length}</div>`;
            this.container.find('.product-image-gallery').append(counter);
          }
        }

        bindEvents() {
          const self = this;
          const prefix = this.isModal ? '.modal-gallery' : '.gallery';
          
          // Arrow navigation
          this.container.on('click', `${prefix}-arrow.prev`, () => {
            this.prevImage();
          });

          this.container.on('click', `${prefix}-arrow.next`, () => {
            this.nextImage();
          });

          // Dot navigation
          const dotClass = this.isModal ? '.modal-gallery-dot' : '.gallery-dot';
          this.container.on('click', dotClass, function() {
            const index = parseInt($(this).data('index'));
            self.showImage(index);
          });

          // Pause auto-rotate on hover
          if (!this.isModal) {
            this.container.hover(
              () => this.pauseAutoRotate(),
              () => this.startAutoRotate()
            );
          }
        }

        showImage(index) {
          const imageElements = this.isModal ? 
            this.container.find('.modal-image-container .product-image') :
            this.container.find('.product-image-container .product-image');
          
          const dotElements = this.isModal ?
            this.container.find('.modal-gallery-dot') :
            this.container.find('.gallery-dot');

          // Hide all images and show selected
          imageElements.removeClass('active');
          imageElements.eq(index).addClass('active');

          // Update dots
          dotElements.removeClass('active');
          dotElements.eq(index).addClass('active');

          // Update counter for card view
          if (!this.isModal) {
            this.container.find('.image-counter').text(`${index + 1} / ${this.images.length}`);
          }

          this.currentIndex = index;
        }

        nextImage() {
          const nextIndex = (this.currentIndex + 1) % this.images.length;
          this.showImage(nextIndex);
        }

        prevImage() {
          const prevIndex = (this.currentIndex - 1 + this.images.length) % this.images.length;
          this.showImage(prevIndex);
        }

        startAutoRotate() {
          if (this.isModal || this.images.length <= 1) return;
          
          this.autoRotateInterval = setInterval(() => {
            this.nextImage();
          }, 4000); // Change image every 4 seconds
        }

        pauseAutoRotate() {
          if (this.autoRotateInterval) {
            clearInterval(this.autoRotateInterval);
            this.autoRotateInterval = null;
          }
        }

        destroy() {
          this.pauseAutoRotate();
          this.container.off('click');
        }
      }

      // Function to load reviews for a specific product
      function loadReviews(itemId) {
        $.ajax({
          method: "GET",
          url: `${url}api/reviews`,
          data: { item_id: itemId },
          dataType: 'json',
          success: function (response) {
            console.log("Reviews API Response:", response);
            $('#productReviews').empty();
            
            if (response.data && Array.isArray(response.data)) {
              if (response.data.length > 0) {
                $('#noReviewsMessage').hide();
                
                // Process each review
                $.each(response.data, function (key, review) {
                  try {
                    // Only show reviews that match the current item_id
                    if (review.item_id == itemId) {
                      const reviewDate = new Date(review.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                      });
                      
                      // Create review card
                      let reviewElement = `
                        <div class="card review-card mb-3">
                          <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                              <div>
                                <span class="review-author">${review.customer_name || 'Anonymous'}</span>
                                <div class="rating">
                                  ${getStarRating(review.rating)}
                                </div>
                              </div>
                              <span class="review-date">${reviewDate}</span>
                            </div>
                            <div class="review-text">
                              ${review.review_text ? `<p>${review.review_text}</p>` : '<p class="text-muted">No review text provided</p>'}
                            </div>
                            <div class="review-images-container" data-review-id="${review.review_id}">
                              <!-- Images will be loaded here by fetchReviewImages -->
                            </div>
                          </div>
                        </div>
                      `;
                      
                      $('#productReviews').append(reviewElement);
                      
                      // Now fetch images for this review
                      fetchReviewImages(review.review_id);
                    }
                  } catch (e) {
                    console.error("Error processing review:", review, e);
                  }
                });
              } else {
                $('#noReviewsMessage').show();
              }
            } else {
              console.error("Unexpected reviews response format:", response);
              $('#noReviewsMessage').show().text("Error loading reviews. Invalid data format.");
            }
          },
          error: function (xhr, status, error) {
            console.error("Error loading reviews:", error);
            $('#noReviewsMessage').show().text("Error loading reviews. Please try again later.");
          }
        });
      }

      // Function to fetch images for a specific review
      function fetchReviewImages(reviewId) {
        $.ajax({
          method: "GET",
          url: `${url}api/review-images`,
          data: { review_id: reviewId },
          dataType: 'json',
          success: function(response) {
            if (response.data && Array.isArray(response.data) && response.data.length > 0) {
              const $container = $(`.review-images-container[data-review-id="${reviewId}"]`);
              let imagesHTML = '<div class="review-images-row">';
              
              $.each(response.data, function(index, image) {
                imagesHTML += `
                  <div class="review-image-thumbnail" data-image-src="${imageBaseUrl}${image.image_path}">
                    <img src="${imageBaseUrl}${image.image_path}" 
                         alt="Review image ${index + 1}" 
                         onerror="this.src='${imageBaseUrl}placeholder.jpg'; this.onerror=null;">
                  </div>
                `;
              });
              
              imagesHTML += '</div>';
              $container.html(imagesHTML);
              
              // Add click handler for thumbnail images
              $container.find('.review-image-thumbnail').click(function() {
                const imageSrc = $(this).data('image-src');
                $('#enlargedReviewImage').attr('src', imageSrc);
                $('#reviewImageModal').addClass('active');
              });
            }
          },
          error: function(xhr, status, error) {
            console.error("Error loading review images:", error);
          }
        });
      }

      // Helper function to generate star rating
      function getStarRating(rating) {
        if (!rating) return '';
        let stars = '';
        for (let i = 1; i <= 5; i++) {
          if (i <= rating) {
            stars += '<i class="fas fa-star text-warning"></i>';
          } else {
            stars += '<i class="far fa-star text-warning"></i>';
          }
        }
        return stars;
      }

      // Load categories
      function loadCategories() {
        $.ajax({
          method: "GET",
          url: `${url}api/category`,
          dataType: 'json',
          success: function (response) {
            $('#categoryFilter').empty();
            $('#categoryFilter').append(`
              <button class="category-btn active" data-category="all">All Categories</button>
            `);
            
            if (response.data && Array.isArray(response.data)) {
              $.each(response.data, function (key, category) {
                $('#categoryFilter').append(`
                  <button class="category-btn" data-category="${category.category_id}">
                    ${category.description || 'Unnamed Category'}
                  </button>
                `);
              });
            } else {
              console.error("Unexpected categories response format:", response);
            }
          },
          error: function (xhr, status, error) {
            console.error("Error loading categories:", error);
            $('#categoryFilter').html('<p class="text-danger">Failed to load categories. Please try again later.</p>');
          }
        });
      }

      // Load items with category filtering
      function loadItems(category = 'all') {
        let apiUrl = `${url}api/item`;
        if (category !== 'all') {
          apiUrl += `?category=${category}`;
        }

        $.ajax({
          method: "GET",
          url: apiUrl,
          dataType: 'json',
          success: function (data) {
              $(".products-grid-container").empty();

              $.each(data.rows, function (key, value) {
                  const productImages = value.images && value.images.length > 0 ? value.images : [value.image];
                  
                  const itemCard = `
                  <div class="product-card" data-id="${value.item_id}">
                      <div class="product-image-gallery">
                          <div class="product-image-container">
                              <!-- Images will be inserted by ImageGallery class -->
                          </div>
                          <button class="gallery-arrow prev">
                              <i class="fas fa-chevron-left"></i>
                          </button>
                          <button class="gallery-arrow next">
                              <i class="fas fa-chevron-right"></i>
                          </button>
                          <div class="gallery-nav">
                              <!-- Navigation dots will be inserted here -->
                          </div>
                      </div>
                      <div class="product-info">
                          <span class="product-category">${value.category_name || 'Uncategorized'}</span>
                          <h3 class="product-name">${value.item_name}</h3>
                          <div class="product-price">₱${value.sell_price}</div>
                          <div class="product-stock">Stock: ${value.quantity ?? 0}</div>
                          <div class="product-actions">
                              <div class="quantity-selector">
                                  <input type="number" class="quantity-input" min="1" max="${value.quantity ?? 1}" value="1">
                              </div>
                              <div class="action-buttons">
                                  <button class="btn-add-cart add-to-cart" 
                                      data-id="${value.item_id}"
                                      data-name="${value.item_name}"
                                      data-price="${value.sell_price}"
                                      data-image="${value.image}"
                                      data-stock="${value.quantity ?? 0}"
                                      data-category="${value.category_id}">
                                      <i class="fas fa-shopping-cart"></i>
                                      Add to Cart
                                  </button>
                                  <button class="btn-view-details view-details" 
                                      data-id="${value.item_id}"
                                      data-name="${value.item_name}"
                                      data-description="${value.description || 'No description available'}"
                                      data-price="${value.sell_price}"
                                      data-image="${value.image}"
                                      data-stock="${value.quantity ?? 0}"
                                      data-category="${value.category_name || 'Uncategorized'}"
                                      data-images='${JSON.stringify(productImages)}'>
                                      <i class="fas fa-info-circle"></i>
                                      Details
                                  </button>
                              </div>
                          </div>
                      </div>
                  </div>`;
                  
                  $(".products-grid-container").append(itemCard);
                  
                  // Initialize image gallery for this product card
                  const $card = $(`.product-card[data-id="${value.item_id}"]`);
                  new ImageGallery($card, productImages, false);
              });
          },
          error: function (error) {
              console.log(error);
          }
        });
      }

      // Store modal gallery instance
      let modalGallery = null;

      // Show product details in modal
      $(document).on('click', '.view-details', function() {
        const id = $(this).data('id');
        const name = $(this).data('name');
        const description = $(this).data('description');
        const price = $(this).data('price');
        const image = $(this).data('image');
        const stock = $(this).data('stock');
        const category = $(this).data('category');
        const images = $(this).data('images') || [image];

        $('#productDetailsModalLabel').text(name).data('id', id);
        $('#modalProductName').text(name);
        $('#modalProductDescription').text(description);
        $('#modalProductCategory').text(category);
        $('#modalProductPrice').text(`₱${price}`);
        $('#modalProductStock').text(stock);
        $('#modalQuantityInput').attr('max', stock).val(1);
        
        // Clean up previous modal gallery
        if (modalGallery) {
          modalGallery.destroy();
        }
        
        // Initialize modal image gallery
        const $modal = $('#productDetailsModal');
        modalGallery = new ImageGallery($modal, images, true);
        
        // Load reviews for this specific product
        loadReviews(id);

        productModal.show();
      });

      // Add to cart from modal
      $(document).on('click', '#modalAddToCart', function() {
        const qty = parseInt($('#modalQuantityInput').val());
        const id = $('#productDetailsModalLabel').data('id');
        const name = $('#modalProductName').text();
        const price = parseFloat($('#modalProductPrice').text().replace('₱', ''));
        const image = $('#modalImageContainer .product-image.active img').attr('src').replace(imageBaseUrl, '');
        const stock = parseInt($('#modalProductStock').text());
        
        if (!isUserLoggedIn()) {
          alert('Please sign in to add items to your cart');
          window.location.href = 'login.html';
          return;
        }

        let cart = getCart();
        let existing = cart.find(item => item.item_id == id);

        if (existing) {
          if ((existing.quantity + qty) > stock) {
            alert(`You can't add more than available stock (${stock})`);
            return;
          }
          existing.quantity += qty;
        } else {
          cart.push({
            item_id: id,
            name,
            price,
            image,
            stock,
            quantity: qty
          });
        }

        saveCart(cart);
        itemCount = cart.reduce((total, item) => total + item.quantity, 0);
        $('#itemCount').text(itemCount).css('display', 'block');
        alert(`${name} added to cart!`);
      });

      // Category filter click handler
      $(document).on('click', '.category-btn', function() {
        const category = $(this).data('category');
        currentCategory = category;
        
        $('.category-btn').removeClass('active');
        $(this).addClass('active');
        
        loadItems(category);
      });

      // Clean up modal gallery when modal closes
      $('#productDetailsModal').on('hidden.bs.modal', function() {
        if (modalGallery) {
          modalGallery.destroy();
          modalGallery = null;
        }
      });

      // Initialize cart count
      $("#home").load("header.html", function() {
          const cart = getCart();
          itemCount = cart.reduce((total, item) => total + item.quantity, 0);
          $('#itemCount').text(itemCount).toggle(itemCount > 0);
      });

      // Initial load
      loadCategories();
      loadItems();
    });
  </script>
</body>
</html>
